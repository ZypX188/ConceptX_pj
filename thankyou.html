<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConceptX | Thank you</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">

    <style>
        body {
            background-color: #e9e1c7;
            font-family: Arial, sans-serif;
        }

        .container {
            display: flex;
            justify-content: center;
            margin-top: 100px;
        }

        .card {
            width: 450px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .header {
            background: linear-gradient(to right, #3b82f6, #1e40af);
            color: white;
            text-align: center;
            padding: 15px;
            border-radius: 15px 15px 0 0;
            font-size: 18px;
        }

        .content {
            padding: 30px;
            text-align: left;
        }

        .content h4 {
            margin-bottom: 0px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card">
            <div class="header">
                Submit successfully completed
            </div>

            <div class="content">
                <p>
                <pre>
<b>We are thank you for visiting our website</b>
                </pre>
                </p>
                <br><br>
                <h4>-TEAM R3</h4>
            </div>
        </div>
    </div>

</body>

</html>
