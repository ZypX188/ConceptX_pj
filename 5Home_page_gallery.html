<!DOCTYPE html>
<html lang="en">

<head>

<style>
    body {
        font-family: 'JetBrains Mono', monospace;
        background-color: gainsboro;
    }

    .title {
        font-family: 'JetBrains Mono', monospace;
        color: rgba(18, 3, 218, 0.849);
        margin-right: auto;
        text-decoration: none;
        cursor: pointer;
    }

    .top {
        padding: 30px;
    }

    .first {
        display: flex;
        gap: 20px;
    }

    .center {
        flex: 1;
    }

    .center img {
        width: 100%;
        height: 350px;
        object-fit: cover;
        border-radius: 9px;
    }

    .second {
        gap: 20px;
        padding: 30px;
    }

    .second-left {
        flex: 3;
        flex-direction: column;
        gap: 20px;
    }

    .second-left img {
        width: 100%;
        height: 250px;
        object-fit: cover;
        border-radius: 9px;
    }

    .second-right {
        flex: 3;
        padding-right: 20px;
    }

    .second-right img {
        width: 100%;
        height: 520px;
        object-fit: cover;
        border-radius: 9px;
    }

    .third {
        display: flex;
        gap: 20px;
        padding: 20px;
    }

    .third-left {
        flex: 2;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .third-left img {
        width: 100%;
        height: 100px;
        object-fit: cover;
        border-radius: 9px;
    }

    .third-left-under {
        width: 100%;
        height: 100px;
        object-fit: cover;
        border-radius: 9px;
    }

    .third-right2 {
        flex: 2;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .third-right2 img {
        width: 100%;
        height: 190px;
        object-fit: cover;
        border-radius: 9px;
    }


    .third-right {
        flex: 5;
    }

    .third-right img {
        width: 100%;
        height: 400px;
        object-fit: cover;
        border-radius: 9px;
    }

    .third-left img {
        width: 100%;
        height: 190px;
        object-fit: cover;
        border-radius: 9px;
    }

    thi .first,
    .second,
    .third {
        display: flex;
        flex-wrap: wrap;
    }
</style>

<body>

    <div>
        <a href="2Home_page.html" class="title">
            <h2>Discover life at ConceptX campus</h2>
        </a>

        <div class="third">
            <div class="third-right">

            </div>

            <div class="third-left">
                <img src="/school gallery images/7.jpg">
